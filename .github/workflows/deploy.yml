name: Deploy to server

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - closed

# Required repository secrets:
#   SSH_PRIVATE_KEY, SSH_HOST, SSH_USER  - SSH access to the deploy server
#   SCHEDULE_LOGIN, SCHEDULE_PASSWORD    - college schedule portal credentials
#   ADMIN_ID                             - Telegram admin id
#   BOT_TOKEN                            - Telegram bot API token

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script
        env:
          SCHEDULE_LOGIN: ${{ secrets.SCHEDULE_LOGIN }}
          SCHEDULE_PASSWORD: ${{ secrets.SCHEDULE_PASSWORD }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "git -C ~/projects/DiskayHub/DiskayBot pull origin master \
             && cp ~/projects/DiskayHub/DiskayBot/deploy.sh ~/projects/DiskayHub/deploy.sh \
             && bash ~/projects/DiskayHub/deploy.sh \
                  --login '$SCHEDULE_LOGIN' \
                  --password '$SCHEDULE_PASSWORD' \
                  --admin-id '$ADMIN_ID' \
                  --token '$BOT_TOKEN'"
